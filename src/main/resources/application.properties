spring.application.name=main_project

# 주석 : .propertis 파일의 주석 방법
# application.propertis 파일 : Spring 스프링 관련 설정 코드 입력하는 곳.

# 1. 내장 톰캣의 포트 번호 변경 , 기본값 = 8080
server.port = 8080

# 2. 데이터베이스 연동

# 2-1. 연동할 데이터베이스 주소
spring.datasource.url = jdbc:mysql://localhost:3306/main_project_db
# 2-2. 데이터베이스 주소의 계정명과 비밀번호
spring.datasource.username = root
spring.datasource.password = 1234

# 3. DDL
spring.jpa.hibernate.ddl-auto = create-drop
# create      : 애플리케이션 실행 시 기존 테이블을 DROP하고 Entity 기반으로 새로 생성 (기존 데이터 전체 삭제).
# create-drop : create와 동일하게 동작하되, 애플리케이션 종료(Shutdown) 시 테이블을 DROP.
# update      : Entity 변경 사항(새로운 컬럼 추가 등)만 DB에 반영 (기존 컬럼/데이터는 유지/삭제 불가).
# validate    : Entity와 DB 테이블이 정상적으로 매핑되었는지만 검증 (불일치 시 애플리케이션 구동 실패).
# none        : 아무런 DDL 자동 생성 기능을 수행하지 않음 (기본값).

# 4. SQL 콘솔 출력
# 4-1. JPA가 생성한 SQL 콘솔 출력 (표준 stdout 출력)
spring.jpa.show-sql = true
# 4-2. 콘솔에 출력되는 SQL 줄바꿈 및 들여쓰기 적용 (가독성 향상)
spring.jpa.properties.hibernate.format_sql = true
# 4-3. SQL 실행 쿼리 로깅 (Logger 레벨 설정)
# logging.level.org.hibernate.sql = DEBUG
# 4-4. SQL 내부의 파라미터 바인딩 값(?에 들어간 실제 값)을 콘솔에 출력 (디버깅 핵심)
# logging.level.org.hibernate.orm.jdbc.bind = TRACE
# 4-5 서버 실행 할때 SQL 파일 실행 *개발단계* , always,none *운영/배포 단계 사용하지 않는다*
spring.sql.init.mode = always
# 4-6 서버 실행 할때 classpath(resources폴더) 이하 에 data.sql 파일 경로 지정
spring.sql.init.data-locations = classpath:/sql/MainDBSampleData.sql
# 4-7 서버 실행 할때 JPA가 초기화 파일 실행
spring.jpa.defer-datasource-initialization = true

# 5. 한글 깨짐 문제 해결
spring.sql.init.encoding = UTF-8


